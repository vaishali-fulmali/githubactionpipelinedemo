name: Enterprise Pipeline

on:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Lint Passed"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Tests Passed"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Security Scan Passed"

  deploy:
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    steps:
      - run: echo "Deployment Successful"
